<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>알바킹 디렉터 스튜디오</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1815; color:#f5efe4; font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif; display:flex; height:100vh; overflow:hidden; }
  nav { width:210px; background:#211d18; border-right:1px solid #38332b; padding:16px 10px; display:flex; flex-direction:column; gap:3px; flex-shrink:0; }
  nav .logo { font-weight:800; font-size:16px; padding:6px 10px 12px; letter-spacing:1px; }
  nav .sect { font-size:10px; opacity:.35; padding:12px 12px 4px; letter-spacing:2px; }
  nav button { text-align:left; padding:8px 12px; border-radius:8px; border:none; background:none; color:#f5efe4; cursor:pointer; font-size:13.5px; }
  nav button:hover { background:#2b261f; }
  nav button.on { background:#f5b942; color:#1a1815; font-weight:700; }
  nav .foot { margin-top:auto; font-size:10.5px; opacity:.4; padding:10px; line-height:1.6; }
  main { flex:1; overflow-y:auto; padding:22px 26px; }
  h1 { font-size:18px; margin-bottom:4px; }
  .sub { opacity:.55; font-size:12.5px; margin-bottom:18px; line-height:1.6; }
  .bgpick { display:flex; gap:6px; margin-bottom:16px; }
  .bgpick button, .btn { padding:6px 12px; border-radius:8px; border:1px solid #4a443a; background:#26221d; color:#f5efe4; cursor:pointer; font-size:12.5px; }
  .bgpick button.on { background:#f5b942; color:#1a1815; border-color:#f5b942; font-weight:700; }
  .order-block { margin-bottom:28px; }
  .order-head { font-size:14px; font-weight:700; margin-bottom:2px; }
  .order-goal { font-size:11.5px; opacity:.5; margin-bottom:12px; max-width:720px; line-height:1.5; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
  .card { background:#26221d; border:1px solid #38332b; border-radius:14px; overflow:hidden; position:relative; }
  .card.golden { border-color:#f5b942; box-shadow:0 0 0 1px #f5b942; }
  .card h2 { font-size:13px; padding:10px 12px 2px; }
  .card .id { font-size:10px; opacity:.4; padding:0 12px 8px; font-family:monospace; }
  .chip { font-size:10px; padding:3px 8px; border-radius:20px; font-weight:700; display:inline-block; }
  .chip.abs { position:absolute; top:10px; right:10px; }
  .chip.generated { background:#3a4a5c; } .chip.approved { background:#3f6b46; } .chip.rejected { background:#6b3f3f; }
  .chip.pending, .chip.planned { background:#4a443a; } .chip.ordered { background:#5c5334; }
  .chip.golden { background:#f5b942; color:#1a1815; }
  .stage { aspect-ratio:1; display:flex; align-items:center; justify-content:center; margin:0 12px; border-radius:10px; overflow:hidden; }
  .stage img { max-width:86%; max-height:86%; cursor:zoom-in; }
  .bg-checker { background:repeating-conic-gradient(#3a352d 0% 25%, #2c2822 0% 50%) 0 0/22px 22px; }
  .bg-white { background:#f7f3ea; } .bg-dark { background:#14120f; } .bg-game { background:linear-gradient(180deg,#3d6b4f,#2b4d38); }
  .mini { display:flex; align-items:center; gap:10px; padding:10px 12px 4px; }
  .mini .dot { width:72px; height:72px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .mini .dot img { max-width:88%; max-height:88%; cursor:zoom-in; }
  .mini .label { font-size:10.5px; opacity:.5; line-height:1.5; }
  .reason { font-size:11px; color:#e08f8f; padding:4px 12px 0; }
  .actions { display:flex; gap:6px; padding:10px 12px 12px; flex-wrap:wrap; }
  .btn.ok { border-color:#3f6b46; } .btn.no { border-color:#6b3f3f; }
  .btn.gold { border-color:#4a443a; color:#f5b942; opacity:.3; font-size:11px; margin-left:auto; }
  .btn.gold:hover { opacity:1; border-color:#f5b942; }
  .missing { padding:40px 12px; text-align:center; opacity:.4; font-size:12.5px; }
  .empty { opacity:.45; font-size:13px; padding:30px 0; line-height:1.7; }
  .panel { background:#26221d; border:1px solid #38332b; border-radius:12px; padding:14px 16px; margin-bottom:16px; }
  .panel h3 { font-size:13px; margin-bottom:8px; }
  .panel ul { margin-left:18px; font-size:12px; line-height:1.8; opacity:.8; }
  table.ev { width:100%; border-collapse:collapse; font-size:12px; }
  table.ev td { padding:6px 8px; border-bottom:1px solid #2b261f; vertical-align:top; }
  table.ev td.t { opacity:.4; white-space:nowrap; font-family:monospace; font-size:11px; }
  .counts { display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .counts .c { background:#26221d; border:1px solid #38332b; border-radius:10px; padding:10px 16px; font-size:12px; }
  .counts .c b { display:block; font-size:20px; }
  .doclist { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .md { max-width:860px; line-height:1.75; font-size:14px; }
  .md h1 { font-size:22px; margin:22px 0 10px; } .md h2 { font-size:18px; margin:20px 0 8px; border-bottom:1px solid #38332b; padding-bottom:6px; }
  .md h3 { font-size:15.5px; margin:16px 0 6px; } .md h4 { font-size:14px; margin:12px 0 4px; }
  .md p { margin:8px 0; } .md li { margin:4px 0 4px 22px; }
  .md code { background:#2b261f; padding:1.5px 6px; border-radius:5px; font-size:12.5px; }
  .md pre { background:#211d18; border:1px solid #38332b; padding:12px; border-radius:10px; overflow-x:auto; margin:10px 0; }
  .md pre code { background:none; padding:0; }
  .md table { border-collapse:collapse; margin:10px 0; font-size:12.5px; }
  .md th, .md td { border:1px solid #38332b; padding:7px 10px; text-align:left; vertical-align:top; }
  .md th { background:#26221d; }
  .md blockquote { border-left:3px solid #f5b942; padding:2px 14px; opacity:.75; margin:10px 0; }
  .md hr { border:none; border-top:1px solid #38332b; margin:18px 0; }
  .md a { color:#f5b942; }
  audio { width:100%; }
  .audio-row { background:#26221d; border:1px solid #38332b; border-radius:12px; padding:12px 14px; margin-bottom:10px; max-width:640px; }
  .audio-row .name { font-size:12.5px; margin-bottom:8px; font-family:monospace; }
  /* 대시보드 */
  .dash { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; max-width:1100px; }
  .dday { font-size:34px; font-weight:800; color:#f5b942; }
  .phases { display:flex; gap:4px; margin-top:10px; flex-wrap:wrap; }
  .phases span { font-size:10.5px; padding:4px 8px; border-radius:6px; background:#2b261f; opacity:.5; }
  .phases span.cur { background:#f5b942; color:#1a1815; font-weight:700; opacity:1; }
  .phases span.done { background:#3f6b46; opacity:.9; }
  .covbar { display:flex; height:10px; border-radius:6px; overflow:hidden; margin:10px 0 6px; background:#2b261f; }
  .covbar i { display:block; height:100%; }
  .legend { font-size:10.5px; opacity:.6; display:flex; gap:12px; flex-wrap:wrap; }
  .golden-thumb { width:84px; height:84px; border-radius:10px; float:right; margin-left:10px; }
  /* 매니페스트 */
  table.man { width:100%; border-collapse:collapse; font-size:12.5px; max-width:900px; }
  table.man th, table.man td { padding:8px 10px; border-bottom:1px solid #2b261f; text-align:left; }
  table.man th { font-size:11px; opacity:.5; font-weight:600; }
  table.man .cat td { padding-top:18px; font-weight:700; font-size:13.5px; border-bottom:1px solid #38332b; }
  table.man img.th { width:36px; height:36px; border-radius:6px; background:repeating-conic-gradient(#3a352d 0% 25%, #2c2822 0% 50%) 0 0/12px 12px; cursor:zoom-in; vertical-align:middle; }
  /* 히스토리 */
  .thread { background:#26221d; border:1px solid #38332b; border-radius:12px; padding:12px 16px; margin-bottom:10px; max-width:900px; }
  .thread .tid { font-family:monospace; font-size:12px; margin-bottom:8px; font-weight:700; }
  .step { display:flex; gap:10px; font-size:12px; padding:3px 0; }
  .step .ts { opacity:.4; font-family:monospace; font-size:11px; white-space:nowrap; }
  .step .ev-ordered { color:#c9b78a; } .step .ev-generated { color:#8ab0c9; }
  .step .ev-approved { color:#8ac98f; } .step .ev-rejected { color:#e08f8f; } .step .ev-promoted-golden-ref { color:#f5b942; font-weight:700; }
  iframe.game { width:100%; height:calc(100vh - 130px); border:1px solid #38332b; border-radius:14px; background:#000; }
  #lightbox { position:fixed; inset:0; background:rgba(10,9,7,.92); display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; z-index:100; cursor:zoom-out; }
  #lightbox.show { display:flex; }
  #lightbox .frame { width:min(82vmin,900px); height:min(82vmin,900px); display:flex; align-items:center; justify-content:center; border-radius:16px; }
  #lightbox .frame img { max-width:92%; max-height:92%; }
  #lightbox .cap { font-size:13px; opacity:.7; font-family:monospace; }
  #lightbox .bgs { display:flex; gap:6px; }
  #lightbox .bgs button { padding:5px 12px; border-radius:8px; border:1px solid #4a443a; background:#26221d; color:#f5efe4; cursor:pointer; font-size:12px; }
  #lightbox .bgs button.on { background:#f5b942; color:#1a1815; border-color:#f5b942; font-weight:700; }
  /* 자체 모달 — VS Code 내장 브라우저가 prompt/confirm을 차단하므로 */
  #modal { position:fixed; inset:0; background:rgba(10,9,7,.75); display:none; align-items:center; justify-content:center; z-index:200; }
  #modal.show { display:flex; }
  #modal .mbox { width:min(480px, 90vw); background:#26221d; border:2px solid #f5b942; border-radius:16px; padding:22px 24px; display:flex; flex-direction:column; gap:14px; }
  #modal .mtext { font-size:14.5px; line-height:1.6; white-space:pre-line; }
  #modal textarea { background:#1a1815; color:#f5efe4; border:1px solid #4a443a; border-radius:10px; padding:10px 12px; font-size:13.5px; font-family:inherit; resize:vertical; }
  #modal .mbtns { display:flex; justify-content:flex-end; gap:8px; }
  #modal .mbtns .primary { background:#f5b942; color:#1a1815; border-color:#f5b942; font-weight:700; }
</style>
</head>
<body>
<nav>
  <div class="logo">👑 알바킹 스튜디오</div>
  <div class="sect">제작</div>
  <button data-v="dash" class="on">📊 대시보드</button>
  <button data-v="manifest">🧩 에셋 현황</button>
  <button data-v="game">🎮 게임</button>
  <div class="sect">검수</div>
  <button data-v="images">🖼 이미지</button>
  <button data-v="audio">🔊 오디오</button>
  <button data-v="texts">✏️ 텍스트</button>
  <div class="sect">기록</div>
  <button data-v="history">🕘 히스토리</button>
  <button data-v="docs">📄 문서</button>
  <div class="foot">결정은 이벤트로 기록되며<br>언제든 번복 가능합니다.<br>최신 결정이 이깁니다.</div>
</nav>
<main id="main"></main>
<div id="modal">
  <div class="mbox">
    <div class="mtext" id="mText"></div>
    <textarea id="mInput" rows="3" placeholder="반려 사유 (검수 기준의 언어로)"></textarea>
    <div class="mbtns"><button class="btn" id="mCancel">취소</button><button class="btn primary" id="mOk">확인</button></div>
  </div>
</div>
<div id="lightbox">
  <div class="frame bg-checker" id="lbFrame"><img id="lbImg" src="" alt=""></div>
  <div class="cap" id="lbCap"></div>
  <div class="bgs" id="lbBgs"></div>
</div>
<script>
let S = null, view = 'dash', bg = 'bg-checker', curDoc = 'STRATEGY.md'
const $ = s => document.querySelector(s)
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
const PHASES = ['P0 부트스트랩','P1 코어 슬라이스','P2 파이프라인','P3 콘텐츠 확장','P4 아트·오디오','P5 QA·밸런스','P6 차별화','P7 폴리싱','P8 제출']
const CHIP = { pending:'대기', planned:'기획됨', ordered:'발주됨', generated:'검수 대기', approved:'승인', rejected:'반려', golden:'★ 골든' }
const STATUS_COLOR = { planned:'#4a443a', ordered:'#5c5334', generated:'#3a4a5c', approved:'#3f6b46', rejected:'#6b3f3f', golden:'#f5b942' }

async function load() { S = await (await fetch('/api/state')).json(); render() }
async function post(url, data) { await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) }); await load() }

// 자체 모달 — 내장 브라우저의 prompt/confirm 차단 대응
function ask({ text, input = false }) {
  return new Promise(res => {
    $('#mText').textContent = text
    const ta = $('#mInput')
    ta.style.display = input ? 'block' : 'none'
    ta.value = ''
    $('#modal').classList.add('show')
    const done = v => { $('#modal').classList.remove('show'); res(v) }
    $('#mOk').onclick = () => done(input ? ta.value.trim() : true)
    $('#mCancel').onclick = () => done(null)
    if (input) setTimeout(() => ta.focus(), 50)
  })
}

window.approve = (o,i) => post('/api/decision', { order:o, item:i, decision:'approved' })
window.approveAll = async (o) => {
  const ord = S.orders.find(x => x.order === o)
  const targets = ord.items.filter(i => i.exists && i.status !== 'approved')
  if (!targets.length) return
  if (!(await ask({ text: `order#${o}의 미승인 ${targets.length}건을 모두 승인합니다.` }))) return
  for (const it of targets)
    await fetch('/api/decision', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ order:o, item:it.id, decision:'approved' }) })
  await load()
}
window.reject = async (o,i) => { const r = await ask({ text:'반려 사유 (검수 기준의 언어로):', input:true }); if (r !== null) post('/api/decision', { order:o, item:i, decision:'rejected', reason:r }) }
window.approveText = i => post('/api/decision', { order:'texts', item:i, decision:'approved' })
window.rejectText = async i => { const r = await ask({ text:'반려 사유 (수정 방향 포함):', input:true }); if (r !== null) post('/api/decision', { order:'texts', item:i, decision:'rejected', reason:r }) }
window.golden = async (o,i) => { if (await ask({ text:'이 이미지를 골든 레퍼런스로 지정합니다.\n이후 모든 이미지 발주가 이 톤에 앵커됩니다. (나중에 변경 가능)' })) post('/api/golden-ref', { order:o, item:i }) }
window.setBg = b => { bg = b; render() }
window.setView = v => { view = v; document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.v === v)); render() }
window.setDoc = d => { curDoc = d; renderDocs() }
window.zoom = (url, cap) => {
  $('#lbImg').src = url; $('#lbCap').textContent = cap
  $('#lbFrame').className = 'frame ' + bg; renderLbBgs()
  $('#lightbox').classList.add('show')
}
function renderLbBgs() {
  $('#lbBgs').innerHTML = ['bg-checker:투명','bg-white:밝음','bg-dark:어둠','bg-game:게임 목업']
    .map(x => { const [c,l] = x.split(':'); return `<button class="${$('#lbFrame').className.includes(c)?'on':''}" onclick="event.stopPropagation(); document.getElementById('lbFrame').className='frame ${c}'; renderLbBgs()">${l}</button>` }).join('')
}
$('#lightbox').addEventListener('click', e => { if (!e.target.closest('.bgs')) $('#lightbox').classList.remove('show') })
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#lightbox').classList.remove('show') })
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => setView(b.dataset.v)))

const bgBtns = () => `<div class="bgpick">${['bg-checker:투명','bg-white:밝음','bg-dark:어둠','bg-game:게임 목업'].map(x => { const [c,l] = x.split(':'); return `<button class="${bg===c?'on':''}" onclick="setBg('${c}')">${l}</button>` }).join('')}</div>`
const criteriaPanel = kinds => kinds.filter(k => S.criteria[k]?.length).map(k => `
  <div class="panel"><h3>검수 기준 — ${k}</h3><ul>${S.criteria[k].map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>`).join('')

// ── 대시보드 ──
function renderDash() {
  const dl = S.status.deadline ? new Date(S.status.deadline) : null
  const dday = dl ? Math.ceil((dl - Date.now()) / 86400000) : null
  const slots = (S.manifest.categories || []).flatMap(c => c.slots || [])
  const byStatus = {}; slots.forEach(s => byStatus[s.status] = (byStatus[s.status] || 0) + 1)
  const covOrder = ['golden','approved','generated','ordered','rejected','planned']
  const curIdx = PHASES.findIndex(p => p.startsWith(S.status.phase || 'P0'))
  const goldenItem = S.orders.flatMap(o => o.items).find(i => i.isGolden)
  $('#main').innerHTML = `
    <h1>대시보드</h1>
    <div class="sub">${esc(S.status.phaseNote || '')}</div>
    <div class="dash">
      <div class="panel">
        <h3>제출 마감</h3>
        <div class="dday">D-${dday ?? '?'}</div>
        <div style="font-size:11px;opacity:.5">2026-08-10 23:59 KST · 제출물 4종 (SUBMISSION.md)</div>
        <div class="phases">${PHASES.map((p,i) => `<span class="${i < curIdx ? 'done' : i === curIdx ? 'cur' : ''}">${p}</span>`).join('')}</div>
      </div>
      <div class="panel">
        <h3>아트 톤</h3>
        ${goldenItem ? `<img class="golden-thumb bg-checker" src="${goldenItem.url}" onclick="zoom('${goldenItem.url}','골든 레퍼런스')">` : ''}
        <div style="font-size:13px">${S.goldenRef ? `골든 레퍼런스 <b style="color:#f5b942">확정</b><br><span style="font-family:monospace;font-size:11px;opacity:.6">${S.goldenRef.item}</span><br><span style="font-size:11px;opacity:.5">모든 이미지 발주가 이 톤에 앵커됩니다 (ADR-008)</span>` : '<b style="color:#e08f8f">미지정</b> — 이미지 검수에서 지정하세요'}</div>
      </div>
      <div class="panel">
        <h3>에셋 커버리지 — 필요 슬롯 ${slots.length}개</h3>
        <div class="covbar">${covOrder.map(k => byStatus[k] ? `<i style="width:${byStatus[k]/slots.length*100}%;background:${STATUS_COLOR[k]}"></i>` : '').join('')}</div>
        <div class="legend">${covOrder.filter(k => byStatus[k]).map(k => `<span><span class="chip ${k}" style="margin-right:4px">${CHIP[k]}</span>${byStatus[k]}</span>`).join('')}</div>
      </div>
      <div class="panel">
        <h3>공정 실측 (이벤트 스토어)</h3>
        <div class="counts" style="margin:0">
          <div class="c"><b>${S.counts.ordered}</b>발주</div><div class="c"><b>${S.counts.generated}</b>생성</div>
          <div class="c"><b>${S.counts.approved}</b>승인</div><div class="c"><b>${S.counts.rejected}</b>반려</div>
        </div>
      </div>
      <div class="panel">
        <h3>최근 이벤트</h3>
        <table class="ev">${S.events.slice(0,6).map(e => `<tr><td class="t">${e.ts?.slice(5,16).replace('T',' ')}</td><td>${e.event} · ${e.item ?? ''}</td></tr>`).join('')}</table>
      </div>
      <div class="panel">
        <h3>최근 커밋</h3>
        <table class="ev">${S.gitLog.slice(0,6).map(c => `<tr><td class="t">${c.hash}</td><td>${esc(c.msg)}</td></tr>`).join('')}</table>
      </div>
    </div>`
}

// ── 에셋 현황 (매니페스트) ──
function renderManifest() {
  const cats = S.manifest.categories || []
  $('#main').innerHTML = `
    <h1>에셋 현황</h1>
    <div class="sub">게임에 필요한 전 에셋 슬롯의 단일 목록 (pipeline/manifest.json). ${esc(S.manifest._note || '')}</div>
    <table class="man">
      <tr><th></th><th>슬롯</th><th>설명</th><th>종류</th><th>상태</th></tr>
      ${cats.map(c => {
        const done = c.slots.filter(s => ['approved','golden'].includes(s.status)).length
        return `
        <tr class="cat"><td colspan="5">${esc(c.name)} <span style="opacity:.5;font-weight:400;font-size:11px">— ${done}/${c.slots.length} 확보</span></td></tr>

// ── 미니 마크다운 렌더러 ──
function md(src) {
  const lines = src.split('\n'); const out = []; let i = 0, inCode = false, codeBuf = []
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
  while (i < lines.length) {
    const l = lines[i]
    if (l.startsWith('```')) { if (inCode) { out.push(`<pre><code>${esc(codeBuf.join('\n'))}</code></pre>`); codeBuf = [] } ; inCode = !inCode; i++; continue }
    if (inCode) { codeBuf.push(l); i++; continue }
    if (/^\s*$/.test(l)) { i++; continue }
    if (/^#{1,4} /.test(l)) { const n = l.match(/^#+/)[0].length; out.push(`<h${n}>${inline(l.replace(/^#+ /,''))}</h${n}>`); i++; continue }
    if (/^---+$/.test(l.trim())) { out.push('<hr>'); i++; continue }
    if (/^> /.test(l)) { const b = []; while (i < lines.length && /^> ?/.test(lines[i])) b.push(lines[i++].replace(/^> ?/,'')); out.push(`<blockquote>${b.map(inline).join('<br>')}</blockquote>`); continue }
    if (/^\|/.test(l)) {
      const rows = []; while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++])
      const parse = r => r.split('|').slice(1,-1).map(c => c.trim())
      const head = parse(rows[0]); const body = rows.slice(2).map(parse)
      out.push(`<table><tr>${head.map(h => `<th>${inline(h)}</th>`).join('')}</tr>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</table>`)
      continue
    }
    if (/^[-*] /.test(l) || /^\d+\. /.test(l)) {
      const items = []; while (i < lines.length && (/^[-*] /.test(lines[i]) || /^\d+\. /.test(lines[i]))) items.push(lines[i++].replace(/^([-*]|\d+\.) /,''))
      out.push(`<ul>${items.map(x => `<li>${inline(x)}</li>`).join('')}</ul>`)
      continue
    }
    out.push(`<p>${inline(l)}</p>`); i++
  }
  return out.join('\n')
}

async function renderDocs() {
  const list = S.docs.map(d => `<button class="btn" style="${d===curDoc?'background:#f5b942;color:#1a1815;border-color:#f5b942;font-weight:700':''}" onclick="setDoc('${d}')">${d.replace('.md','')}</button>`).join('')
  $('#main').innerHTML = `<h1>문서</h1><div class="sub">docs/ 의 설계·전략 문서 열람. 편집은 에디터에서.</div><div class="doclist">${list}</div><div class="md" id="mdbox">불러오는 중...</div>`
  const src = await (await fetch('/docs/' + curDoc)).text()
  const box = document.getElementById('mdbox'); if (box) box.innerHTML = md(src)
}

function render() {
  ({ dash: renderDash, manifest: renderManifest, game: renderGame, images: renderImages, audio: renderAudio, texts: renderTexts, history: renderHistory, docs: renderDocs })[view]()
}

load()
setInterval(async () => {
  if (view === 'docs' || view === 'game') return
  const sig = s => JSON.stringify([s?.counts, s?.orders?.map(o => o.items.map(i => i.exists + i.status)), s?.gitLog?.[0], s?.texts?.categories?.map(c => c.entries.map(t => t.status + !!t.shotUrl))])
  const prev = sig(S)
  S = await (await fetch('/api/state')).json()
  if (prev !== sig(S)) render()
}, 5000)
