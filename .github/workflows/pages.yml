# GitHub Pages 배포 — 제출 플레이 링크 (ADR-004: 제출 양식이 "GitHub Pages (링크)"를 명시)
# private 리포에선 Pages가 비활성일 수 있음(무료 플랜) — 제출 전 public 전환 시 자동 활성화.
name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 스태프롤 커밋 수 실측(gen-credits)용 전체 이력
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node tools/bake-studio.mjs dist/studio # 심사용 디렉터 스튜디오 스냅샷 (/studio/)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
